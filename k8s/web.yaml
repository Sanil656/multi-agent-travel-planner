apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-planner-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: travel-planner-web
  template:
    metadata:
      labels:
        app: travel-planner-web
    spec:
      containers:
        - name: web
          image: sanilgupta1/travel-planner-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8501
          env:
            - name: DATABASE_URL
              value: postgresql://postgres:postgres@travel-planner-db-service:5432/langgraph_memory
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: travel-planner-secrets
                  key: groq-api-key
            - name: TAVILY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: travel-planner-secrets
                  key: tavily-api-key
            - name: OPENWEATHER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: travel-planner-secrets
                  key: openweather-api-key
            - name: AVIATION_STACK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: travel-planner-secrets
                  key: aviation-stack-api-key
---
apiVersion: v1
kind: Service
metadata:
  name: travel-planner-web-service
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8501
  selector:
    app: travel-planner-web
